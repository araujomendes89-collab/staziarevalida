# Monta a imagem da ponte de voz no Google Cloud Build (nada pesado roda no Mac). Usado por scripts/cloudrun/deploy-voz-ponte.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "cloudrun/voz-ponte/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
